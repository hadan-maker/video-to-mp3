<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حوّل الفيديو إلى MP3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap">
<style>
:root{--bg:#f1f3ee;--ink:#16231f;--mute:#5d6b66;--card:#fff;--line:#cfd7d1;--acc:#0f6b57;--acc-ink:#fff;--hi:#e9a620}
@media (prefers-color-scheme:dark){:root{--bg:#101815;--ink:#e8efeb;--mute:#93a39c;--card:#18231f;--line:#2c3b35;--acc:#3fc3a2;--acc-ink:#07130f;--hi:#f0b93a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;line-height:1.7}
main{max-width:560px;margin:0 auto;padding:28px 18px 40px}
h1{font-size:2.2rem;font-weight:800;line-height:1.25;margin:8px 0 6px}
p.sub{color:var(--mute);margin:0 0 22px}
#drop{display:block;border:2px dashed var(--line);border-radius:18px;background:var(--card);padding:34px 16px;text-align:center;cursor:pointer;transition:border-color .2s}
#drop.over,#drop:focus-within,#drop:hover{border-color:var(--acc)}
#drop input{position:absolute;opacity:0;width:1px;height:1px}
#drop b{display:block;font-size:1.15rem}
#drop span{color:var(--mute);font-size:.92rem}
.bars{display:flex;gap:4px;justify-content:center;align-items:center;height:44px;margin-bottom:10px}
.bars i{width:5px;border-radius:3px;background:var(--acc);height:10px}
.busy .bars i{animation:w .9s ease-in-out infinite}
@keyframes w{50%{height:40px}}
.bars i:nth-child(1){height:14px}.bars i:nth-child(2){height:26px;animation-delay:.1s}
.bars i:nth-child(3){height:38px;animation-delay:.2s}.bars i:nth-child(4){height:22px;animation-delay:.3s}
.bars i:nth-child(5){height:32px;animation-delay:.4s}.bars i:nth-child(6){height:16px;animation-delay:.5s}
.bars i:nth-child(7){height:28px;animation-delay:.6s}
@media (prefers-reduced-motion:reduce){.busy .bars i{animation:none}}
.row{display:flex;gap:10px;align-items:center;margin:16px 0;flex-wrap:wrap}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:14px 18px;width:100%;background:var(--acc);color:var(--acc-ink);cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button.sec{background:transparent;color:var(--acc);border:2px solid var(--acc);margin-top:10px}
button:focus-visible,select:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
#list{list-style:none;padding:0;margin:16px 0 0}
#list li,#merged li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
#merged{list-style:none;padding:0;margin:14px 0 0}
.nm{font-weight:500;word-break:break-all}
.st{color:var(--mute);font-size:.9rem}
.st.err{color:#c0392b}
.st.ok{color:var(--acc)}
li progress{width:100%;height:6px;accent-color:var(--acc);margin-top:6px}
li a{display:inline-block;margin-top:6px;font-weight:800;color:var(--acc)}
li audio{width:100%;margin-top:8px}
footer{margin-top:28px;color:var(--mute);font-size:.88rem}
</style>
</head>
<body>
<main>
<h1>حوّل الفيديو إلى MP3</h1>
<p class="sub">ارفع فيديو واحدًا أو عدة فيديوهات، وادمجها في ملف صوتي واحد.</p>

<label id="drop">
  <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <b>اختر الفيديوهات أو اسحبها هنا</b>
  <span>MP4 ،MOV ،MKV ،AVI ،WebM حتى 200 ميجابايت للملف الواحد</span>
  <input id="inp" type="file" accept="video/*,audio/*" multiple>
</label>

<ul id="list"></ul>

<div class="row">
  <label for="kbps">الجودة</label>
  <select id="kbps">
    <option value="128">128 كيلوبت (حجم أصغر)</option>
    <option value="192" selected>192 كيلوبت (متوازنة)</option>
    <option value="320">320 كيلوبت (أعلى جودة)</option>
  </select>
</div>

<button id="go" disabled>حوّل الكل إلى MP3</button>
<button id="mg" class="sec" hidden>ادمج الملفات الجاهزة في ملف واحد</button>
<button id="dl" class="sec" hidden>نزّل كل الملفات الجاهزة</button>
<ul id="merged"></ul>
<footer>تُحوَّل الملفات واحدًا بعد الآخر. يُرفع كل ملف إلى الخادم ثم يُحذف فور انتهاء تحويله. يتبع الدمج ترتيب الملفات في القائمة.</footer>
</main>

<script>
var MAX_MB=200,drop=document.getElementById('drop'),inp=document.getElementById('inp'),
go=document.getElementById('go'),dl=document.getElementById('dl'),mg=document.getElementById('mg'),
list=document.getElementById('list'),merged=document.getElementById('merged'),
kbps=document.getElementById('kbps'),items=[],running=false,mergeUrl=null;

function size(f){return (f.size/1048576).toFixed(1)+' ميجابايت'}
function pending(){return items.filter(function(x){return !x.done&&!x.bad})}
function doneItems(){return items.filter(function(x){return x.done})}
function refresh(){
  go.disabled=running||pending().length===0;
  dl.hidden=doneItems().length===0;
  mg.hidden=doneItems().length<2;
  drop.classList.toggle('busy',running);
}

function addFiles(fl){
  for(var i=0;i<fl.length;i++){
    var f=fl[i];
    var it={file:f,done:false,bad:false,name:f.name.replace(/\.[^.]+$/,'')+'.mp3'};
    var li=document.createElement('li');
    var nm=document.createElement('div');nm.className='nm';nm.textContent=f.name+' ('+size(f)+')';
    var st=document.createElement('div');st.className='st';
    var p=document.createElement('progress');p.max=100;p.value=0;p.hidden=true;
    li.appendChild(nm);li.appendChild(st);li.appendChild(p);list.appendChild(li);
    it.li=li;it.st=st;it.p=p;
    if(f.size>MAX_MB*1048576){it.bad=true;st.textContent='أكبر من '+MAX_MB+' ميجابايت، تم تجاهله.';st.className='st err'}
    else st.textContent='في الانتظار';
    items.push(it);
  }
  refresh();
}

inp.addEventListener('change',function(){addFiles(inp.files);inp.value=''});
['dragenter','dragover'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.add('over')})});
['dragleave','drop'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.remove('over')})});
drop.addEventListener('drop',function(ev){addFiles(ev.dataTransfer.files)});

function convertOne(it){
  return new Promise(function(resolve){
    it.p.hidden=false;it.p.value=0;it.st.className='st';it.st.textContent='جارٍ الرفع…';
    var fd=new FormData();fd.append('kbps',kbps.value);fd.append('file',it.file);
    var x=new XMLHttpRequest();
    x.open('POST','/convert');x.responseType='blob';
    x.upload.onprogress=function(e){if(e.lengthComputable)it.p.value=Math.round(e.loaded/e.total*100)};
    x.upload.onload=function(){it.p.removeAttribute('value');it.st.textContent='جارٍ التحويل…'};
    function fail(m){it.p.hidden=true;it.st.className='st err';it.st.textContent=m}
    x.onerror=function(){fail('انقطع الاتصال بالخادم.');resolve('stop')};
    x.onload=function(){
      if(x.status===200){
        var url=URL.createObjectURL(x.response);
        it.done=true;it.blob=x.response;it.p.hidden=true;
        it.st.className='st ok';it.st.textContent='تم التحويل ('+(x.response.size/1048576).toFixed(1)+' ميجابايت)';
        var a=document.createElement('a');a.href=url;a.download=it.name;a.textContent='نزّل '+it.name;
        var au=document.createElement('audio');au.controls=true;au.src=url;
        it.li.appendChild(a);it.li.appendChild(document.createElement('br'));it.li.appendChild(au);
        it.a=a;resolve(true);
      }else{
        x.response.text().then(function(t){
          var m='حدث خطأ.';
          try{m=JSON.parse(t).error||m}catch(e){}
          fail(m);
          resolve(x.status===429||x.status===503?'stop':false);
        });
      }
    };
    x.send(fd);
  });
}

go.addEventListener('click',async function(){
  running=true;refresh();
  var q=pending();
  for(var i=0;i<q.length;i++){
    var r=await convertOne(q[i]);
    if(r==='stop')break;
  }
  running=false;refresh();
});

dl.addEventListener('click',async function(){
  var d=doneItems();
  for(var i=0;i<d.length;i++){
    d[i].a.click();
    await new Promise(function(r){setTimeout(r,700)});
  }
});

mg.addEventListener('click',function(){
  var d=doneItems();
  if(d.length<2)return;
  var blob=new Blob(d.map(function(x){return x.blob}),{type:'audio/mpeg'});
  if(mergeUrl)URL.revokeObjectURL(mergeUrl);
  mergeUrl=URL.createObjectURL(blob);
  merged.innerHTML='';
  var li=document.createElement('li');
  var nm=document.createElement('div');nm.className='nm';
  nm.textContent='الملف المدموج ('+d.length+' ملفات، '+(blob.size/1048576).toFixed(1)+' ميجابايت)';
  var au=document.createElement('audio');au.controls=true;au.src=mergeUrl;
  var a=document.createElement('a');a.href=mergeUrl;a.download='merged.mp3';a.textContent='نزّل merged.mp3';
  li.appendChild(nm);li.appendChild(au);li.appendChild(document.createElement('br'));li.appendChild(a);
  merged.appendChild(li);
  li.scrollIntoView({behavior:'smooth',block:'nearest'});
});
</script>
</body>
</html>
